[project]
name = "adnetwork-reporting-mcp"
version = "0.1.0"
description = "MCP server that normalizes ad network reports into one schema: spend, installs, CPI, ROAS, anomalies and pacing"
readme = "README.md"
license = "MIT"
authors = [{ name = "Arunkumar V", email = "arunkumarv1530@gmail.com" }]
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.0.11,<5"]

[project.scripts]
adnet-mcp = "adnet_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adnet_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
